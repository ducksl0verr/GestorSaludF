
<div id="contenedor">

    <h2 id="titulo">Listado de diagnósticos</h2>

    <button routerLink="/admin/diagnosticos/form">
        Nuevo diagnóstico
    </button>

    <ul>

        @for (d of diagnosticos(); track d.id) {

            <li class="tarjeta">

                <h3>{{ d.nombre }}</h3>

                <p>Descripción: {{ d.descripcion }}</p>

                <p>Fecha: {{ d.fechaDiagnostico }}</p>

                <button [routerLink]="['/admin/diagnosticos', d.id]">
                    Ver detalle
                </button>

            </li>

        } @empty {

            <p>No hay diagnósticos registrados.</p>

        }

    </ul>

</div>
