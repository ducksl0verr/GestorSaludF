
<main id="contenedor-form">

  <section id="cajita">

    <h2 id="titulo">
      {{ id ? 'Editar receta' : 'Registrar receta' }}
    </h2>

    <form novalidate (submit)="onSubmit($event)">

      <label for="fecha">Fecha:</label>

      <input
        id="fecha"
        type="date"
        [formField]="recetaForm.fecha"
      >

      @if (recetaForm.fecha().invalid() && recetaForm.fecha().touched()) {
        @for (error of recetaForm.fecha().errors(); track $index) {
          <p class="error">{{ error.message }}</p>
        }
      }

      <div class="botones">

        <button type="submit">
          {{ id ? 'Actualizar' : 'Registrar' }}
        </button>

        <button type="button" (click)="cancelar()">
          Cancelar
        </button>

      </div>

    </form>

  </section>

</main>
