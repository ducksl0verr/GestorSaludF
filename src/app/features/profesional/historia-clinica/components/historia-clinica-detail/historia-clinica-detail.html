
<div id="cajita">
    <h2 id="titulo">Datos de la historia clínica</h2>

    @if (historiaClinica(); as h) {
        <div id="datos">
            <h3>Historia clínica</h3>

            <p>Fecha: {{ h.fecha }}</p>

            <p>Observaciones: {{ h.observaciones }}</p>

            <p>Evolución: {{ h.evolucion }}</p>

            <button [routerLink]="['/admin/historia-clinica/form', h.id]">
                Editar
            </button>

            <button (click)="eliminarHistoriaClinica(h.id)">
                Eliminar
            </button>
        </div>
    } @else {
        <p>Cargando historia clínica...</p>
    }
</div>
