
<div id="contenedor">

    <h2 id="titulo">Listado de historias clínicas</h2>

    <button id="btn-nuevo" routerLink="/admin/historia-clinica/form">
        Nueva historia clínica
    </button>

    <ul id="listado">

        @for (h of historiasClinicas(); track h.id) {

            <li class="tarjeta">

                <h3>Historia clínica</h3>

                <p><strong>Fecha:</strong> {{ h.fecha }}</p>

                <p><strong>Observaciones:</strong> {{ h.observaciones }}</p>

                <p><strong>Evolución:</strong> {{ h.evolucion }}</p>

                <button [routerLink]="['/admin/historia-clinica', h.id]">
                    Ver detalle
                </button>

            </li>

        } @empty {

            <li id="mensaje-vacio">
                No hay historias clínicas registradas.
            </li>

        }

    </ul>

</div>
