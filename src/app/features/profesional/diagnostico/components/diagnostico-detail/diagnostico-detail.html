
<div id="cajita">

    <h2 id="titulo">Datos del diagnóstico</h2>

    @if (diagnostico(); as d) {

        <div id="datos">

            <h3>{{ d.nombre }}</h3>

            <p>Descripción: {{ d.descripcion }}</p>

            <p>Fecha de diagnóstico: {{ d.fechaDiagnostico }}</p>

            <button [routerLink]="['/admin/diagnosticos/form', d.id]">
                Editar
            </button>

            <button (click)="eliminarDiagnostico(d.id)">
                Eliminar
            </button>

        </div>

    } @else {

        <p>Cargando diagnóstico...</p>

    }

</div>
