
<div class="contenedor">

    <h2>{{ turnoId() ? 'Editar turno' : 'Registrar turno' }}</h2>

    <form (submit)="$event.preventDefault(); guardarTurno()">

        <!-- FECHA Y HORA -->
        <div class="campo">
            <label>Fecha y hora:</label>
            <input
                type="datetime-local"
                [formField]="turnoForm.fechaHora"
            >
        </div>

        @if (!turnoId()) {

            <!-- DATOS PARA REGISTRAR -->

            <h3>Datos del turno</h3>

            <div class="campo">
                <label>Paciente:</label>
                <select [formField]="turnoForm.id_paciente">
                    <option value="0" disabled>Seleccionar paciente</option>
                    @for (paciente of pacientes(); track paciente.id) {
                        <option [value]="paciente.id.toString()">
                            {{ paciente.nombre }} {{ paciente.apellido }} - DNI {{ paciente.dni }}
                        </option>
                    }
                </select>
            </div>

            <div class="campo">
                <label>Tratamiento:</label>
                <select [formField]="turnoForm.id_tratamiento">
                    <option value="0" disabled>Seleccionar tratamiento</option>
                    @for (tratamiento of tratamientos(); track tratamiento.id) {
                        <option [value]="tratamiento.id.toString()">
                            {{ tratamiento.nombre }}
                        </option>
                    }
                </select>
            </div>

            <div class="campo">
                <label>Sala / consultorio:</label>
                <select [formField]="turnoForm.id_consultorio">
                    <option value="0" disabled>Seleccionar sala</option>
                    @for (consultorio of consultorios(); track consultorio.id) {
                        <option [value]="consultorio.id.toString()">
                            {{ consultorio.nombre }}
                        </option>
                    }
                </select>
            </div>

            <div class="campo">
                <label>Profesional:</label>
                <select [formField]="turnoForm.id_profesional">
                    <option value="0" disabled>Seleccionar profesional</option>
                    @for (profesional of profesionales(); track profesional.id) {
                        <option [value]="profesional.id.toString()">
                            {{ profesional.nombre }} {{ profesional.apellido }}
                        </option>
                    }
                </select>
            </div>

        } @else {

            <!-- DATOS PARA EDITAR -->

            <div class="campo">
                <label>Estado del turno:</label>

                <select [formField]="turnoForm.estadoTurno">
                    @for (estado of estadosTurno; track estado) {
                        <option [value]="estado">
                            {{ estado }}
                        </option>
                    }
                </select>
            </div>

        }

        <div class="acciones">
            <button type="submit">
                {{ turnoId() ? 'Guardar cambios' : 'Registrar turno' }}
            </button>

            <button type="button" [routerLink]="[base, 'turnos']">
                Volver
            </button>
        </div>

    </form>

</div>
