<div class="contenedor">

    <h2>Listado de consultorios</h2>

    <a [routerLink]="[base, 'consultorios', 'nuevo']" class="boton-agregar">
        Registrar consultorio
    </a>

    @if (consultorios().length > 0) {

        <div class="tabla-responsive">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                @for (consultorio of consultorios(); track consultorio.id) {
                    <tr>
                        <td>{{ consultorio.id }}</td>
                        <td>{{ consultorio.nombre }}</td>
                        <td>
                            <a [routerLink]="[base, 'consultorios', consultorio.id]">
                                Ver detalle
                            </a>

                            <a [routerLink]="[base, 'consultorios', 'editar', consultorio.id]">
                                Editar
                            </a>

                        </td>
                    </tr>
                }
            </tbody>
        </table>
        </div>

    } @else {
        <p>No hay consultorios registrados.</p>
    }

</div>
