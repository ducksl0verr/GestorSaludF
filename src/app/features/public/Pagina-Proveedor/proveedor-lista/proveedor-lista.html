<div id="contenedor">
    <p id="titulo">Proveedores</p>
    <button [routerLink]="[base, 'proveedores', 'nuevo']">Nuevo Proveedor</button>
    <ul>
        @for(pr of proveedores(); track pr.id){
            <li>
                <p>
                    {{ pr.id }} - {{ pr.nombre }}
                </p>
                <button [routerLink]="[base, 'proveedores', 'editar', pr.id]">Editar</button>
                <button [routerLink]="[base, 'proveedores', pr.id]">Ver detalles</button>
                <button [routerLink]="[base, 'proveedores', pr.id, 'mensaje']">Enviar mensaje</button>
            </li>
        }
    </ul>
</div>
