
<h1>Panel protegido</h1>

<p>Esta pantalla prueba la conexión con Spring Boot usando JWT uwu.</p>

<button (click)="comprobarAcceso()">
  Comprobar acceso
</button>

<button (click)="cerrarSesion()">
  Cerrar sesión
</button>

@if (respuesta(); as datos) {
  <section>
    <h2>¡Acceso autorizado!</h2>
    <p>{{ datos.mensaje }}</p>
    <p>{{ datos.estado }}</p>
  </section>
}

@if (error()) {
  <p>{{ error() }}</p>
}
